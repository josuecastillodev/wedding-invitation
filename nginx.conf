server {
    listen 80;
    server_name _;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El sitio se construye con base "/liliana-y-daniel" (Astro static no anida
    # el dist en esa subcarpeta, solo prefija los links) así que hay que servir
    # el contenido bajo ese mismo prefijo.
    location /liliana-y-daniel/_astro/ {
        alias /usr/share/nginx/html/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /liliana-y-daniel/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ $uri.html =404;
    }

    location = / {
        return 302 /liliana-y-daniel/;
    }

    location = /liliana-y-daniel {
        return 302 /liliana-y-daniel/;
    }
}
